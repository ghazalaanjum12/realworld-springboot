services:
  mysql:
    image: mysql:8.0
    container_name: realworld_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: realworld_db
      MYSQL_USER: realworld_user
      MYSQL_PASSWORD: realworld_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: